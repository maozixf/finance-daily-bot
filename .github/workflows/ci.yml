name: Tests

on:
  push:
    paths-ignore:
      - "state/deliveries.json"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v
