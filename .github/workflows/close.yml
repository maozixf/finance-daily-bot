name: CLS Daily Market Review

on:
  schedule:
    # Beijing Monday-Friday 16:50
    - cron: "50 8 * * 1-5"
    # Beijing Monday-Friday 17:03, 17:10, 17:30
    - cron: "3,10,30 9 * * 1-5"
    # Beijing Monday-Friday 18:30 fallback
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Beijing date (YYYY-MM-DD); empty means today"
        required: false
        type: string
      dry_run:
        description: "Render without sending"
        required: false
        default: true
        type: boolean
      force:
        description: "Ignore successful delivery state"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: finance-daily-bot-state
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run.yml
    with:
      job_name: close
      run_date: ${{ inputs.run_date || '' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    secrets: inherit
