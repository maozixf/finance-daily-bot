name: CLS Daily Market Review (Manual Only)

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Beijing date (YYYY-MM-DD); empty means today"
        required: false
        type: string
      dry_run:
        description: "Render without sending"
        required: false
        default: true
        type: boolean
      force:
        description: "Ignore successful delivery state"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: finance-daily-bot-state
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run.yml
    with:
      job_name: close
      run_date: ${{ inputs.run_date || '' }}
      dry_run: ${{ inputs.dry_run }}
      force: ${{ inputs.force }}
    secrets: inherit
