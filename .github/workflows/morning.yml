name: Morning Market Scan

on:
  workflow_dispatch:
    inputs:
      job_name:
        description: "Automatic CLS + JYS scan or one selected source"
        required: false
        default: morning_scan
        type: choice
        options:
          - morning_scan
          - morning
          - pre_market
      run_date:
        description: "Beijing date (YYYY-MM-DD); empty means today"
        required: false
        type: string
      dry_run:
        description: "Render without sending"
        required: false
        default: true
        type: boolean
      force:
        description: "Ignore successful delivery state"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: finance-daily-bot-state
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run.yml
    with:
      job_name: ${{ inputs.job_name || 'morning_scan' }}
      run_date: ${{ inputs.run_date || '' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    secrets: inherit
