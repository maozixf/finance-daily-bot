name: CLS Weekend Digest

on:
  schedule:
    # Beijing daily 15:50
    - cron: '50 7 * * *'
    # Beijing daily 16:20, 16:50
    - cron: '20,50 8 * * *'
    # Beijing daily 17:20, 17:55
    - cron: '20,55 9 * * *'
    # Beijing daily 18:30 fallback
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      run_date:
        description: "Beijing date (YYYY-MM-DD); empty means today"
        required: false
        type: string
      dry_run:
        description: "Render without sending"
        required: false
        default: true
        type: boolean
      force:
        description: "Ignore successful delivery state"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: finance-daily-bot-state
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run.yml
    with:
      job_name: weekend
      run_date: ${{ inputs.run_date || '' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    secrets: inherit
