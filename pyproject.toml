[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-daily-bot"
version = "0.1.0"
description = "Scheduled CLS, JYS and DXX finance brief delivery bot"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
finance-daily-bot = "finance_bot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
